[project]
name = "forge-delivery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "python-dotenv>=1,<2", "playwright>=1.51,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
